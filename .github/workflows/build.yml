name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Generar proyecto Android (solo archivos que faltan)
        run: |
          flutter create --platforms=android --org com.fernando --project-name balance .
          rm -f test/widget_test.dart

      - name: Ajustar Gradle
        run: python3 tool/patch_android.py

      - name: Dependencias
        run: flutter pub get

      - name: Análisis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renombrar
        run: cp build/app/outputs/flutter-apk/app-release.apk balance-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: balance-apk
          path: balance-${{ github.run_number }}.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Balance build ${{ github.run_number }}
          files: balance-${{ github.run_number }}.apk
