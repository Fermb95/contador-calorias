name: balance
description: Contador de calorías personal (uso privado).
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.1
  path: any
  shared_preferences: ^2.3.3
  http: ^1.2.2
  mobile_scanner: ^7.5.0
  health: ^13.3.2
  flutter_local_notifications: ^18.0.1
  timezone: any
  share_plus: ^13.3.1
  file_picker: ^13.3.2
